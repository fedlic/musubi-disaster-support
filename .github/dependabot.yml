version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      maintenance:
        patterns:
          - "*"
    # typescript-eslint does not yet accept ESLint 10. Resume major updates
    # once the surrounding lint toolchain supports it.
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@eslint/js"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

